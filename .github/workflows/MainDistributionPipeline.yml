#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v1.5.5
      ci_tools_version: main
      extension_name: anndata
      opt_in_archs: 'linux_amd64_musl'
      # wasm_mvp/wasm_eh are BUILT again (HDF5 is now linked via LINKED_LIBS in
      # CMakeLists.txt) and gated by the wasm-checks job below, but still NOT
      # deployed: the extension cannot open any file until the duckdb::FileSystem
      # VFD port lands (spec/wasm-support-spec.md, Phase 2+). wasm_threads stays
      # excluded entirely: extension-ci-tools builds extensions without
      # -fwasm-exceptions against a COI main module built with it, and the
      # prebuilt HDF5 archives are non-pthread (issue #24).
      exclude_archs: 'wasm_threads'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: v1.5.5
      ci_tools_version: main
      extension_name: anndata
      format_checks: 'format;tidy'

  # Test remote file access (S3 and HTTP) using MinIO
  remote-access-test:
    name: Remote Access Tests
    needs: duckdb-stable-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Start MinIO server
        run: |
          docker run -d --name minio-server \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO..."
            sleep 1
          done

      - name: Setup bucket and upload test files
        run: |
          # Create bucket, set policy, and upload files
          docker run --rm --network host --entrypoint sh \
            -v "${{ github.workspace }}/test/data:/testdata:ro" \
            minio/mc -c "
              mc alias set local http://localhost:9000 minioadmin minioadmin
              mc mb local/data
              mc anonymous set download local/data
              mc cp --recursive /testdata/*.h5ad local/data/
            "

          # Verify files are accessible
          echo "Files available:"
          docker run --rm --network host --entrypoint sh minio/mc -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc ls local/data/"

      - uses: actions/download-artifact@v7
        with:
          name: anndata-v1.5.5-extension-linux_amd64
          path: /tmp/extension

      - name: Setup DuckDB with extension
        run: |
          # Debug: List downloaded files
          echo "=== Contents of /tmp/extension ==="
          ls -la /tmp/extension/

          # Download DuckDB CLI to /tmp to avoid conflict with duckdb/ submodule
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip -O /tmp/duckdb_cli.zip
          unzip -o -q /tmp/duckdb_cli.zip -d /tmp/duckdb-cli
          chmod +x /tmp/duckdb-cli/duckdb

          # Setup extension directory (no gunzip needed - file is not compressed)
          mkdir -p ~/.duckdb/extensions/v1.5.5/linux_amd64
          cp /tmp/extension/anndata.duckdb_extension ~/.duckdb/extensions/v1.5.5/linux_amd64/

      - name: Run remote access tests
        env:
          ANNDATA_TEST_S3_ENDPOINT: localhost:9000
          ANNDATA_TEST_S3_ACCESS_KEY: minioadmin
          ANNDATA_TEST_S3_SECRET_KEY: minioadmin
          ANNDATA_TEST_HTTP_ENDPOINT: http://localhost:9000/data
        run: |
          # Run S3 tests
          echo "=== Running S3 Tests ==="
          /tmp/duckdb-cli/duckdb -unsigned -c "
            LOAD anndata;
            INSTALL httpfs;
            LOAD httpfs;
            CREATE SECRET minio_secret (
              TYPE S3,
              KEY_ID 'minioadmin',
              SECRET 'minioadmin',
              ENDPOINT 'localhost:9000',
              URL_STYLE 'path',
              USE_SSL false
            );
            ATTACH 's3://data/test_small.h5ad' AS s3data (TYPE ANNDATA);
            SELECT COUNT(*) FROM s3data.obs;
            SELECT COUNT(*) FROM s3data.var;
            DETACH s3data;
          "

          # Run HTTP tests
          echo "=== Running HTTP Tests ==="
          /tmp/duckdb-cli/duckdb -unsigned -c "
            LOAD anndata;
            INSTALL httpfs;
            LOAD httpfs;
            ATTACH 'http://localhost:9000/data/test_small.h5ad' AS httpdata (TYPE ANNDATA);
            SELECT COUNT(*) FROM httpdata.obs;
            SELECT COUNT(*) FROM httpdata.var;
            DETACH httpdata;
          "

          echo "=== All remote access tests passed ==="

  # WASM gates: the side-module link (-sSIDE_MODULE=2) does NOT fail on
  # unresolved symbols, so a green build can produce an artifact that dies at
  # LOAD inside duckdb-wasm - which is what every wasm artifact published
  # before these checks did (issue #24). Two layers:
  #   1. symbol contract: imports(side) - exports(side) - exports(main) == {}
  #   2. load smoke: INSTALL + LOAD + anndata_version() under real duckdb-wasm
  wasm-checks:
    name: WASM Checks
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # On pull_request the upstream build runs in reduced_ci_mode, which
        # builds only wasm_eh among the wasm arches - a wasm_mvp leg would fail
        # at download-artifact. Full coverage on push/dispatch, eh-only on PRs.
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"duckdb_arch":"wasm_eh","main_module":"duckdb-eh.wasm"}]')
          || fromJSON('[{"duckdb_arch":"wasm_mvp","main_module":"duckdb-mvp.wasm"},{"duckdb_arch":"wasm_eh","main_module":"duckdb-eh.wasm"}]') }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: anndata-v1.5.5-extension-${{ matrix.duckdb_arch }}
          path: /tmp/extension

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install duckdb-wasm (pin must carry DuckDB v1.5.5 - see test/wasm/README.md)
        working-directory: test/wasm
        run: npm install

      - name: Symbol contract check
        run: |
          python3 scripts/wasm_symbol_check.py \
            /tmp/extension/anndata.duckdb_extension.wasm \
            --main test/wasm/node_modules/@duckdb/duckdb-wasm/dist/${{ matrix.main_module }} \
            --allowlist test/wasm/allowed_undefined.txt \
            --expect-platform ${{ matrix.duckdb_arch }} \
            --expect-duckdb v1.5.5

      - name: Load smoke test (INSTALL + LOAD + version + functions)
        working-directory: test/wasm
        run: |
          # Fresh HOME every run: the duckdb-wasm Node loader caches HTTP
          # bodies (including error bodies) under ~/.duckdb/extensions/.
          HOME="$(mktemp -d)" node run_node.mjs \
            /tmp/extension/anndata.duckdb_extension.wasm \
            ${{ matrix.duckdb_arch }} v1.5.5 "$(cat ../../VERSION)" \
            ../data/test_small.h5ad

  # Deploy the in-browser demo (demo/browser/) to GitHub Pages.
  #
  # One site, many deployments: pushes to main publish the site ROOT; every
  # same-repo PR push (and any manual dispatch from a branch) publishes a
  # per-branch PREVIEW at /preview/<branch>/, so the latest implementation is
  # always viewable pre-merge. CleanupPreview.yml removes a branch's preview
  # folder when its PR closes. The gh-pages branch is kept at exactly ONE
  # orphan commit per publish (no history), so the ~6 MB of wasm artifacts
  # per deploy never accumulate in git history.
  #
  # Where the URL surfaces: on a PR it is posted as a STICKY PR comment (one
  # comment per PR, edited in place on every push, found again via a hidden
  # HTML marker) - that is where reviewers look. It is also written to the
  # job summary on every deploy, PR or not.
  #
  # PR runs build only wasm_eh (reduced CI), so the wasm_mvp artifact is
  # optional - every modern browser selects the eh bundle anyway.
  # Once the wasm build is published to community-extensions, the bundled
  # artifact (and the custom_extension_repository line in index.html) can go.
  deploy-demo:
    name: Deploy demo to GitHub Pages
    needs: wasm-checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push to gh-pages
      pull-requests: write   # sticky preview-URL comment on the PR
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: anndata-v1.5.5-extension-wasm_eh
          path: /tmp/wasm_eh

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: anndata-v1.5.5-extension-wasm_mvp
          path: /tmp/wasm_mvp

      - name: Assemble site content
        run: |
          mkdir -p content/extension/v1.5.5/wasm_eh content/data
          cp demo/browser/index.html content/
          cp /tmp/wasm_eh/anndata.duckdb_extension.wasm content/extension/v1.5.5/wasm_eh/
          if [ -f /tmp/wasm_mvp/anndata.duckdb_extension.wasm ]; then
            mkdir -p content/extension/v1.5.5/wasm_mvp
            cp /tmp/wasm_mvp/anndata.duckdb_extension.wasm content/extension/v1.5.5/wasm_mvp/
          fi
          cp test/data/test_small.h5ad content/data/

      - name: Publish to gh-pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # The SHA stamped on the deploy commit, the summary and the PR
          # comment. On pull_request, github.sha is the synthetic merge commit
          # (refs/pull/N/merge) that nobody can find in the PR; the PR head is
          # what reviewers recognise and what the checkout is derived from.
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # main -> site root; branches/PRs -> preview/<sanitized-branch>/
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          if [ "$BRANCH" = "main" ]; then DEST=""; else DEST="preview/$(echo "$BRANCH" | tr '/' '-')"; fi

          # This job runs 15-20 minutes after the push. If the PR was merged or closed in the
          # meantime, CleanupPreview.yml has already removed the preview folder and we must not
          # recreate it (nothing would ever remove it again). The check happens inside the
          # gh-pages-publish concurrency group, so a cleanup cannot slip in between it and the push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            STATE="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .state)"
            if [ "$STATE" != "open" ]; then
              echo "PR #${{ github.event.pull_request.number }} is ${STATE}; not publishing a preview"
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "Demo preview skipped: PR is ${STATE}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site \
            || { mkdir site && git -C site init -b gh-pages; }

          if [ -z "$DEST" ]; then
            # replace the root, preserving all previews
            find site -mindepth 1 -maxdepth 1 ! -name preview ! -name .git -exec rm -rf {} +
            cp -R content/. site/
          else
            rm -rf "site/$DEST"
            mkdir -p "site/$DEST"
            cp -R content/. "site/$DEST/"
          fi
          touch site/.nojekyll

          cd site
          git checkout --orphan publish
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "deploy ${DEPLOY_SHA} to ${DEST:-root}"
          git push --force origin publish:gh-pages

          URL="https://honicky.github.io/anndata-duckdb-extension/${DEST:+$DEST/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Demo preview: [${URL}](${URL}) (commit ${DEPLOY_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"

      # Sticky comment: exactly one per PR, edited in place on every push so
      # the thread does not fill with stale URLs. The comment is found again
      # by the hidden HTML marker in its body (author github-actions[bot]).
      # The body goes through a file (-F body=@file) so no quoting of SQL or
      # markdown is needed on the command line.
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.publish.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          MARKER='<!-- anndata-demo-preview -->'

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ${MARKER}
          ### Wasm demo preview

          [${PREVIEW_URL}](${PREVIEW_URL})

          Built from PR head \`${HEAD_SHA:0:7}\` (\`${HEAD_SHA}\`) merged into \`${BASE_REF}\` (the CI merge ref) at the time of this run.

          GitHub Pages can take a minute to serve a fresh deploy - if the page looks stale, hard-reload (Ctrl/Cmd+Shift+R).

          Try it: open the link, click **Load sample .h5ad**, run \`SELECT * FROM anndata_info('test_small.h5ad');\` - or drop your own \`.h5ad\` onto the page.

          This preview is removed automatically when the PR closes (\`CleanupPreview.yml\`).
          EOF

          # Find the existing sticky comment, if any. gh applies --jq per page
          # under --paginate, so slurp the pages in jq and take the first hit.
          EXISTING_ID="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            | jq -rs --arg marker "$MARKER" \
                '[ .[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id ] | first // empty')"

          if [ -n "$EXISTING_ID" ]; then
            gh api --silent -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" -F body=@"$BODY_FILE"
            echo "updated sticky comment ${EXISTING_ID} on PR #${PR_NUMBER}: ${PREVIEW_URL}"
          else
            gh api --silent -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@"$BODY_FILE"
            echo "posted sticky comment on PR #${PR_NUMBER}: ${PREVIEW_URL}"
          fi

  # Auto-tag when version changes and deploy if tagged
  auto-tag:
    name: Create Version Tag
    # wasm-checks is in the needs chain deliberately: a wasm regression on main
    # must block tagging/deploying a release, not just turn the run red.
    needs: [duckdb-stable-build, wasm-checks]
    runs-on: ubuntu-latest
    # Only run on main branch after successful build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write  # Need write permission to create tags
    outputs:
      version_changed: ${{ steps.tag.outputs.version_changed }}
      version: ${{ steps.tag.outputs.version }}
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create tag if version changed
        id: tag
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: $CURRENT_VERSION"
          
          # Check if tag exists
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${CURRENT_VERSION} already exists, skipping"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Creating tag v${CURRENT_VERSION}"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "v${CURRENT_VERSION}" -m "Release version ${CURRENT_VERSION}"
            git push origin "v${CURRENT_VERSION}"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
            echo "Tag created. Will deploy to S3 if AWS credentials are configured."
          fi
  
  # Deploy to S3 when version changes
  deploy:
    name: Deploy to S3  
    needs: [duckdb-stable-build, auto-tag]
    if: needs.auto-tag.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        duckdb_arch: [linux_amd64, linux_amd64_musl, linux_arm64, osx_amd64, osx_arm64, windows_amd64, windows_amd64_mingw]
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: 'recursive'
          
      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout v1.5.5

      - uses: actions/download-artifact@v7
        with:
          name: anndata-v1.5.5-extension-${{matrix.duckdb_arch}}
          path: /tmp/extension
          
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_ORG_DEPLOY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_ORG_DEPLOY_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_DEPLOY_REGION }}
          BUCKET_NAME: ${{ vars.S3_DEPLOY_BUCKET }}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
        run: |
          python3 -m pip install awscli
          git config --global --add safe.directory '*'
          cd duckdb
          git fetch --tags
          export DUCKDB_VERSION=`git tag --points-at HEAD`
          export DUCKDB_VERSION=${DUCKDB_VERSION:=`git log -1 --format=%h`}
          cd ..
          git fetch --tags
          export EXT_VERSION=`git tag --points-at HEAD`
          export EXT_VERSION=${EXT_VERSION:=`git log -1 --format=%h`}
          ./scripts/deploy-extension.sh anndata $EXT_VERSION $DUCKDB_VERSION ${{ matrix.duckdb_arch }} $BUCKET_NAME true true