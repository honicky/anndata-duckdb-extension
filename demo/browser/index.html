<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnnData &times; DuckDB-WASM</title>
<style>
  /* Deliberate single look: a dark terminal. */
  :root {
    --bg: #101418; --panel: #171d24; --border: #2a3441;
    --fg: #d7e0ea; --dim: #7d8b9a; --accent: #53b1fd;
    --ok: #6fd08c; --err: #ff7a7a; --warn: #e8c064;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button, label.filebtn {
    background: #1f2937; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover, label.filebtn:hover { border-color: var(--accent); }
  #term { flex: 1; overflow-y: auto; padding: 12px 16px; white-space: pre-wrap; word-break: break-word; }
  #term .cmd  { color: var(--accent); }
  #term .err  { color: var(--err); }
  #term .ok   { color: var(--ok); }
  #term .dim  { color: var(--dim); }
  #term table { border-collapse: collapse; margin: 4px 0; font-size: 13px; }
  #term th, #term td {
    border: 1px solid var(--border); padding: 2px 10px; text-align: left;
    max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #term th { color: var(--warn); font-weight: 600; background: var(--panel); }
  #inputrow {
    display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border);
    background: var(--panel); align-items: center;
  }
  #prompt { color: var(--ok); }
  #sql {
    flex: 1; background: transparent; color: var(--fg); border: none; outline: none;
    font: inherit;
  }
  body.dragging::after {
    content: "drop .h5ad to register"; position: fixed; inset: 0;
    background: rgba(83,177,253,.12); border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--accent); pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>AnnData &times; DuckDB-WASM</h1>
  <span class="status" id="status">booting&hellip;</span>
  <span class="spacer"></span>
  <button id="loadsample">Load sample .h5ad</button>
  <label class="filebtn">Open .h5ad&hellip;<input id="filepick" type="file" accept=".h5ad,.h5" multiple hidden></label>
</header>
<div id="term"></div>
<div id="inputrow">
  <span id="prompt">D</span>
  <input id="sql" autocomplete="off" spellcheck="false"
         placeholder="SQL, or .help — Enter runs, ↑/↓ history" disabled>
</div>

<script type="module">
// Pinned to the duckdb-wasm build that carries DuckDB v1.5.5, matching the
// extension artifact served from /extension/v1.5.5/... (see test/wasm/README.md
// for the lockstep rule).
import * as duckdb from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev64.0/+esm";

const term = document.getElementById("term");
const input = document.getElementById("sql");
const statusEl = document.getElementById("status");

function line(text, cls = "") {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  return div;
}

const MAX_ROWS = 40;
function renderTable(result) {
  const rows = result.toArray();
  const cols = result.schema.fields.map(f => f.name);
  const tbl = document.createElement("table");
  const tr = document.createElement("tr");
  for (const c of cols) { const th = document.createElement("th"); th.textContent = c; tr.appendChild(th); }
  tbl.appendChild(tr);
  for (const row of rows.slice(0, MAX_ROWS)) {
    const tr = document.createElement("tr");
    for (const c of cols) {
      const td = document.createElement("td");
      const v = row[c];
      td.textContent = v === null || v === undefined ? "NULL" : String(v);
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  term.appendChild(tbl);
  if (rows.length > MAX_ROWS) line(`… ${rows.length - MAX_ROWS} more rows`, "dim");
  term.scrollTop = term.scrollHeight;
  return rows.length;
}

let db = null, conn = null;
const registered = [];

// Base URL of the page's directory. The demo may be served from a subpath
// (e.g. GitHub Pages at /anndata-duckdb-extension/), so same-site resources
// (extension repository, sample data) must resolve relative to the page,
// never to location.origin.
const SITE_BASE = new URL(".", location.href).href;

// URLs quoted inside SQL (ATTACH 'https://...', anndata_scan_obs('https://...'))
// are rewritten to lazily registered names (registerFileURL) so queries issue
// HTTP range requests instead of downloading whole files. The BROWSER fetches
// the URL directly, so the host must send CORS headers (with Range allowed in
// the preflight) - e.g. the public CellxGene Census S3 bucket does. Hosts
// that don't cannot be read by any in-browser tool.
const urlNames = new Map(); // url -> registered name
async function rewriteRemoteUrls(sql) {
  // never rewrite configuration statements - SET custom_extension_repository,
  // INSTALL ... FROM <url>, CREATE SECRET etc. legitimately contain URLs that
  // are not data files
  if (/^\s*(set|install|load|pragma|create\s+secret|force\s+install)\b/i.test(sql)) return sql;
  const urls = [...new Set([...sql.matchAll(/'(https?:\/\/[^']+)'/g)].map((m) => m[1]))];
  for (const url of urls) {
    let name = urlNames.get(url);
    if (!name) {
      name = (url.split("/").pop() || "remote.h5ad").split("?")[0];
      for (let i = 2; registered.includes(name); i++) name = name.replace(/(~\d+)?$/, `~${i}`);
      await db.registerFileURL(name, url, duckdb.DuckDBDataProtocol.HTTP, false);
      registered.push(name);
      urlNames.set(url, name);
      line(`registered ${name} -> ${url} (lazy, HTTP range requests)`, "ok");
    }
    sql = sql.split(`'${url}'`).join(`'${name}'`);
  }
  return sql;
}

// Printed when a query against a remote URL fails at the network layer.
// duckdb-wasm's own message ("File not found ... must be registered") is
// misleading: the file WAS registered; the browser refused the request.
function corsHint() {
  line("remote files are fetched by the BROWSER, so the host must send CORS headers", "dim");
  line("(allow the Range request header) plus Range support and Content-Length.", "dim");
  line("Known-good: the public CellxGene Census bucket. Hosts without CORS (e.g.", "dim");
  line("datasets.cellxgene.cziscience.com) cannot be read by any in-browser tool -", "dim");
  line("use the terminal extension, or download once and drag & drop.", "dim");
}

async function run(sql, { echo = true } = {}) {
  if (echo) line(`D ${sql}`, "cmd");
  const t0 = performance.now();
  let remote = false;
  try {
    const rewritten = await rewriteRemoteUrls(sql);
    remote = rewritten !== sql;
    sql = rewritten;
    const result = await conn.query(sql);
    const ms = (performance.now() - t0).toFixed(0);
    if (result.numRows > 0 || result.numCols > 0) {
      const n = renderTable(result);
      line(`${n} row${n === 1 ? "" : "s"} (${ms} ms)`, "dim");
    } else {
      line(`ok (${ms} ms)`, "dim");
    }
    return true;
  } catch (e) {
    const msg = String(e?.message ?? e).trim();
    line(msg, "err");
    if (remote && /NetworkError|Failed to load|File not found/i.test(msg)) corsHint();
    return false;
  }
}

async function registerBytes(name, bytes) {
  // capture the size first: registerFileBuffer transfers the buffer to the
  // worker, detaching it here (bytes.length becomes 0 after the await)
  const n = bytes.length;
  await db.registerFileBuffer(name, bytes);
  registered.push(name);
  const sz = n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${(n / 1e3).toFixed(1)} KB`;
  line(`registered ${name} (${sz})`, "ok");
  line(`try:  SELECT * FROM anndata_scan_obs('${name}') LIMIT 5;`, "dim");
  line(`      ATTACH '${name}' AS d (TYPE ANNDATA); SHOW ALL TABLES;`, "dim");
}

async function registerFiles(files) {
  for (const f of files) {
    // registerFileHandle keeps the File as a lazy disk handle: the extension's
    // ranged VFD reads only the byte ranges each query touches, so file size
    // is bounded by the query's working set, not browser memory. No cap.
    await db.registerFileHandle(f.name, f, duckdb.DuckDBDataProtocol.BROWSER_FILEREADER, false);
    registered.push(f.name);
    const sz = f.size >= 1e6 ? `${(f.size / 1e6).toFixed(1)} MB` : `${(f.size / 1e3).toFixed(1)} KB`;
    line(`registered ${f.name} (${sz}, lazy - reads only what queries touch)`, "ok");
    line(`try:  SELECT * FROM anndata_scan_obs('${f.name}') LIMIT 5;`, "dim");
    line(`      ATTACH '${f.name}' AS d (TYPE ANNDATA); SHOW ALL TABLES;`, "dim");
  }
}

const HELP = `.help                 this text
.files                list registered files
.open <url>           fetch a URL and register it (CORS permitting)
Anything else runs as SQL. Useful starters:
  SELECT * FROM anndata_scan_obs('file.h5ad') LIMIT 5;
  SELECT * FROM anndata_info('file.h5ad');
  ATTACH 'file.h5ad' AS d (TYPE ANNDATA);  SHOW ALL TABLES;  SELECT * FROM d.obs LIMIT 5;
Files must be registered first (drag & drop, Open, or Load sample) -
registration is lazy: queries read only the byte ranges they touch.
http(s):// and s3:// URLs can be queried directly (host must send CORS + Range),
e.g. the public CellxGene Census bucket:
  ATTACH 'https://cellxgene-census-public-us-west-2.s3.us-west-2.amazonaws.com/cell-census/2023-07-25/h5ads/0895c838-e550-48a3-a777-dbcd35d30272.h5ad' AS census (TYPE ANNDATA);
  SET s3_region='us-west-2'; SET s3_access_key_id='...'; SET s3_secret_access_key='...';
  SELECT * FROM anndata_scan_obs('s3://bucket/file.h5ad') LIMIT 5;`;

async function dot(cmd) {
  const [word, ...rest] = cmd.split(/\s+/);
  if (word === ".help") { line(HELP, "dim"); return; }
  if (word === ".files") {
    line(registered.length ? registered.join("\n") : "(none registered)", "dim");
    return;
  }
  if (word === ".open" && rest[0]) {
    // registerFileURL keeps the URL as a lazy handle: duckdb-wasm issues HTTP
    // range requests for exactly the byte ranges queries touch (server must
    // support Range + expose Content-Length via CORS). Nothing is downloaded
    // up front. (Querying an UNregistered http:// path also works, but
    // downloads the whole file first - duckdb-wasm's allowFullHTTPReads
    // fallback.)
    // The HEAD/GET happens as sync XHR inside the duckdb-wasm worker, which
    // is created from a blob: URL - relative paths cannot resolve there.
    // Absolutize against the page origin first.
    const url = /^[a-z][a-z0-9+.-]*:/i.test(rest[0]) ? rest[0] : new URL(rest[0], SITE_BASE).href;
    const baseName = (url.split("/").pop() || "remote.h5ad").split("?")[0];
    const freshName = (n) => {
      // an open file cannot be dropped (the extension may hold it in its
      // file cache) - pick a fresh name rather than failing
      for (let i = 2; registered.includes(n); i++) n = n.replace(/(~\d+)?$/, `~${i}`);
      return n;
    };
    const tryRegister = async (regUrl) => {
      const n = freshName(baseName);
      try { await db.dropFile(n); } catch {}
      await db.registerFileURL(n, regUrl, duckdb.DuckDBDataProtocol.HTTP, false);
      registered.push(n);
      return n;
    };
    let name;
    try {
      name = await tryRegister(url);
      line(`registered ${name} -> ${url} (lazy, HTTP range requests)`, "ok");
    } catch (e) {
      line(`register failed: ${e.message}`, "err");
      return;
    }
    const ok = await run(`SELECT * FROM anndata_info('${name}')`);
    if (ok) {
      line(`query it, e.g.  SELECT * FROM anndata_scan_obs('${name}') LIMIT 5;`, "dim");
    } else {
      corsHint();
    }
    return;
  }
  line(`unknown command: ${cmd} — .help`, "err");
}

// ---- REPL wiring ----
const history = []; let hIdx = -1;
input.addEventListener("keydown", async (e) => {
  if (e.key === "ArrowUp") { if (hIdx < history.length - 1) input.value = history[++hIdx] ?? ""; e.preventDefault(); return; }
  if (e.key === "ArrowDown") { input.value = hIdx > 0 ? history[--hIdx] : (hIdx = -1, ""); e.preventDefault(); return; }
  if (e.key !== "Enter") return;
  const text = input.value.trim();
  if (!text) return;
  history.unshift(text); hIdx = -1;
  input.value = ""; input.disabled = true;
  try {
    if (text.startsWith(".")) { line(`D ${text}`, "cmd"); await dot(text); }
    else await run(text);
  } finally {
    input.disabled = false; input.focus();
  }
});

document.getElementById("filepick").addEventListener("change", (e) => registerFiles(e.target.files));
document.getElementById("loadsample").addEventListener("click", async () => {
  // Deliberately uses registerFileBuffer (the in-memory BUFFER path) so the
  // demo exercises it alongside registerFileHandle (drag & drop) and
  // registerFileURL (.open) - three byte sources, one VFD.
  line("D (load sample: fetch + registerFileBuffer)", "cmd");
  try {
    const resp = await fetch(`${SITE_BASE}data/test_small.h5ad`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    await registerBytes("test_small.h5ad", new Uint8Array(await resp.arrayBuffer()));
  } catch (e) {
    line(`sample load failed: ${e.message}`, "err");
  }
});
document.body.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
document.body.addEventListener("dragleave", () => document.body.classList.remove("dragging"));
document.body.addEventListener("drop", (e) => {
  e.preventDefault(); document.body.classList.remove("dragging");
  registerFiles(e.dataTransfer.files);
});

// ---- boot ----
try {
  line("AnnData × DuckDB-WASM — single-cell .h5ad files, queried with SQL, entirely in this tab.", "dim");
  line("");
  statusEl.textContent = "selecting bundle…";
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const arch = /coi/.test(bundle.mainModule) ? "wasm_threads" : /eh/.test(bundle.mainModule) ? "wasm_eh" : "wasm_mvp";
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" }));
  const worker = new Worker(workerUrl);
  db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), worker);
  statusEl.textContent = "instantiating…";
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  // filesystem flags: this duckdb-wasm build defaults to force-full HTTP
  // reads (whole-file download on first access). reliableHeadRequests +
  // !forceFullHTTPReads switches registered URLs to lazy range-request mode
  // (verified: obs scan on a 110 MB file = 1 HEAD + 47 range GETs, 11.7 MB
  // transferred). Servers without Range support still fall back to a full
  // download via allowFullHTTPReads.
  await db.open({
    path: ":memory:",
    allowUnsignedExtensions: true,
    filesystem: {
      allowFullHTTPReads: true,
      reliableHeadRequests: true,
      forceFullHTTPReads: false,
    },
  });
  conn = await db.connect();
  window.demo = { db, conn, duckdb }; // for DevTools poking

  const one = async (sql) => String((await conn.query(sql)).getChildAt(0)?.get(0));
  const engineVersion = await one("SELECT version()");
  line(`DuckDB-WASM ${engineVersion} (${arch})`, "ok");

  statusEl.textContent = "loading anndata extension…";
  await run(`SET custom_extension_repository='${SITE_BASE}extension'`);
  const okInstall = await run("INSTALL anndata") && await run("LOAD anndata");
  if (!okInstall) {
    line("", "");
    line("The extension artifact is missing. Build it, then reload:", "err");
    line("    make wasm_eh        # with emsdk active; see demo/browser/README.md", "dim");
    statusEl.textContent = "extension missing";
  } else {
    const extVersion = await one("SELECT anndata_version()");
    line(`anndata extension ${extVersion}`, "ok");
    line("");
    line("Drop an .h5ad anywhere, use Open…, or click “Load sample .h5ad”. .help for more.", "dim");
    statusEl.textContent = `DuckDB ${engineVersion} · anndata ${extVersion} · ${arch}`;
    input.disabled = false; input.focus();
  }
} catch (e) {
  line(`boot failed: ${e?.message ?? e}`, "err");
  statusEl.textContent = "boot failed";
}
</script>
</body>
</html>
